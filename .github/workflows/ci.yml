name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar PowerShell e PSD1
        shell: powershell
        run: .\ci\validate.ps1

      - name: Instalar PSScriptAnalyzer no runner
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Analisar PowerShell
        shell: powershell
        run: |
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error)
          $results | Format-Table -AutoSize
          if ($results.Count -gt 0) { throw "PSScriptAnalyzer encontrou $($results.Count) erro(s)." }

      - name: Executar testes
        shell: powershell
        run: |
          .\tests\run-all.ps1
          .\tests\winget-context.tests.ps1
          .\tests\security-hardening.tests.ps1
          .\tests\local-accounts.tests.ps1

  linux:
    name: Scripts WSL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar sintaxe Bash
        run: |
          bash -n wsl/linux/bootstrap.sh
          bash -n wsl/linux/verify.sh
          bash -n wsl/linux/github-release.sh
          bash -n wsl/linux/prepare-ai-memory-upgrade.sh
          bash -n tests/wsl-link-resolution.tests.sh

      - name: Analisar Bash
        run: shellcheck wsl/linux/bootstrap.sh wsl/linux/verify.sh wsl/linux/github-release.sh wsl/linux/prepare-ai-memory-upgrade.sh tests/wsl-link-resolution.tests.sh

      - name: Testar resolução dos links do harness
        run: bash tests/wsl-link-resolution.tests.sh
